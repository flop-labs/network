name: Operator intake forms

on:
  pull_request:
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
      - .github/workflows/**
      - tests/**
      - README.md
      - SUPPORT.md
      - OPERATOR-INTAKE.md
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.yml
      - .github/workflows/**
      - tests/**
      - README.md
      - SUPPORT.md
      - OPERATOR-INTAKE.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run --no-project --with pyyaml python -m unittest discover -s tests -v
