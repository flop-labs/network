name: Sync labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml, .github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(yq 'length' .github/labels.yml)
          for i in $(seq 0 $((n - 1))); do
            name=$(yq -r ".[$i].name" .github/labels.yml)
            color=$(yq -r ".[$i].color" .github/labels.yml)
            desc=$(yq -r ".[$i].description" .github/labels.yml)
            gh label create "$name" --color "$color" --description "$desc" --force --repo "$GITHUB_REPOSITORY"
          done
