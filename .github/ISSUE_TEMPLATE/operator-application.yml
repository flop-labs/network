name: Validator / RPC operator registration
description: Register your team and network. Add node readiness and optional RPC contribution details as they become available.
title: "operator: "
labels: ["type:registration", "intake:operator", "status:intake", "area:node"]
body:
  - type: markdown
    attributes:
      value: >-
        Register once per team and network. Use the same issue to add nodes and update your progress.
        Start with the [public Devnet RPC guide](https://gist.github.com/sv/7c8b93f3868bc15e3b6eabe0578057e3#run-a-flop-devnet-rpc-replica).
        Devnet keyless sync is available without Tailscale. Public signing qualification remains pending.
        You can register for Testnet now, even while planning a host. Leave qualification pending until FLOP publishes the Testnet package and network inputs.
        Use a fresh database and the published inputs for the selected network. Devnet inputs and receipts do not qualify a Testnet node.
        This issue is public. Never upload seeds, private keys, account.json, .env, keystores,
        enrollment tokens, credentials or TLS private keys. No SSH access is requested.
  - type: input
    id: team
    attributes:
      label: Team ID
      description: Stable public team or operator name, reused across your nodes and receipts.
      placeholder: example-team
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [devnet, testnet]
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Operator role
      options:
        - validator operator
        - RPC contributor
        - validator operator and RPC contributor
    validations:
      required: true
  - type: input
    id: existing
    attributes:
      label: Existing registration or introduction
      description: Link your previous issue, network#10 comment, or registration on the other network. Leave empty if this is your first registration.
    validations:
      required: false
  - type: textarea
    id: capacity
    attributes:
      label: Planned capacity and host
      description: Start with one keyless node per team. Record your planned node count and add individual node details as hosts become ready.
      placeholder: |
        Planned validator nodes / existing FLOP seats:
        RPC nodes offered (active / standby):
        Provider / region:
        CPU / RAM / SSD capacity / OS:
        Public host label or P2P address (if prepared):
    validations:
      required: true
  - type: dropdown
    id: preparation
    attributes:
      label: Preparation stage
      options:
        - planning a host
        - syncing a keyless node
        - synced; restart evidence pending
        - sync and restart evidence ready
        - already invited to the administrator-assisted validator flow
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sync and restart evidence
      description: >-
        Add evidence after sync. Once published, the network-specific qualify-rpc.mjs collector produces a public-safe receipt.
        Include your restart attestation separately. Maintainers independently verify the evidence.
        Give full hashes and public values only. Keep raw configuration and unredacted logs private.
      placeholder: |
        Public-safe collector receipt (once published):
        Guide revision / exact node image digest:
        Chain spec SHA-256 / expected genesis:
        Advertised public P2P multiaddress / Peer ID:
        No Tailscale on this keyless host:
        Observation 1: UTC, local/reference finalized heights, common height/hash, readiness:
        Observation 2: UTC, local/reference finalized heights, common height/hash, readiness:
        After restart: same observations, advancing finality, unchanged Peer ID:
        Restart attestation: same Compose project and volume retained:
        Public SS58 address (if already prepared; not needed for keyless sync):
    validations:
      required: false
  - type: textarea
    id: rpc
    attributes:
      label: Optional RPC pool contribution
      description: >-
        Pool admission is separate. Keep the origin keyless. Share the dedicated RPC origin hostname, fixed IP and incident contacts privately with FLOP.
        Set up mTLS only after FLOP supplies its client CA and edge egress addresses.
      placeholder: |
        Archive retention:
        Sustainable HTTP and WebSocket capacity:
        Additional replicas / failure domains:
    validations:
      required: false
  - type: textarea
    id: blockers
    attributes:
      label: Questions or blockers
      description: Use this thread for follow-up. Request a private channel here if needed; do not publish personal incident contacts or credentials.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Before submitting
      options:
        - label: I checked for an existing registration for this team and network and will keep evidence in one thread.
          required: true
        - label: This registration contains only public information and no secrets or private configuration files.
          required: true
        - label: I understand that this registration records our team and nodes. Validator activation, sponsorship and rewards each have their own requirements.
          required: true
